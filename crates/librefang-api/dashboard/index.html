<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LibreFang" />
    <meta name="theme-color" content="#020617" />
    <!-- These live in `public/`, which Vite copies verbatim without rewriting references to it, so they must be written against the `/dashboard/` base by hand. -->
    <!-- Relative forms resolved against whichever URL served the shell — `/` serves the same file as `/dashboard/<route>` does — and 404d for half of them. -->
    <link rel="manifest" href="/dashboard/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" type="image/png" sizes="192x192" href="/dashboard/icon-192.png" />
    <link rel="apple-touch-icon" href="/dashboard/icon-192.png" />
    <title>LibreFang Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/dashboard/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
